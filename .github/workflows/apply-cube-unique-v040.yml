name: Apply cube v0.4.0 unique paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cube-unique-v040.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v0.4.0 changes
        run: python patch_cube_unique_v040.py
      - name: Validate
        run: |
          node --check cube/cube.js
          git diff --check
          grep -q "const APP_VERSION = '0.4.0';" cube/cube.js
          grep -q 'function findWordPaths' cube/cube.js
          grep -q 'fillBoardWithoutDuplicateTargets' cube/cube.js
          grep -q 'data-solved-step' cube/cube.css
          grep -q 'cube.js?v=0.4.0' cube/index.html
          grep -q 'cube.css?v=0.4.0' cube/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cube/index.html cube/cube.css cube/cube.js
          git commit -m "Cube v0.4.0: enforce unique paths and mark solved routes"
          git push origin HEAD:main
