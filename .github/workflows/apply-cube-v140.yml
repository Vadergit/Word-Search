name: Apply Cube v1.4.0 loading UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cube-v140.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply v1.4.0 patch
        run: python3 patch_cube_v140.py

      - name: Validate
        run: |
          node --check cube/cube.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          html=Path('cube/index.html').read_text(encoding='utf-8')
          css=Path('cube/cube.css').read_text(encoding='utf-8')
          js=Path('cube/cube.js').read_text(encoding='utf-8')
          assert "const APP_VERSION = '1.4.0';" in js
          assert 'cubeLoading' in html and 'loader-cube' in html
          assert 'cubeThemeValue' in html and 'theme-showcase' in html
          assert 'async function newPuzzle()' in js
          assert 'await letLoaderPaint()' in js
          assert '@keyframes wordCubeSpin' in css
          assert 'cube.js?v=1.4.0' in html
          print('v1.4.0 checks passed')
          PY

      - name: Commit v1.4.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cube/index.html cube/cube.css cube/cube.js
          git diff --cached --quiet && exit 0
          git commit -m 'Cube v1.4.0: add loading cube and stronger theme UI'
          git push origin HEAD:main
