name: Fix daily determinism

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-daily-determinism.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch deterministic theme choice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''    const candidates=valid.filter(t=>t.name!==previousThemeName);\n    const pool=candidates.length?candidates:valid;\n    currentTheme=pool[Math.floor(rand()*pool.length)];'''
          new='''    const deterministicRun=activeGameMode==="daily"||Boolean(customSeed);\n    const candidates=deterministicRun?valid:valid.filter(t=>t.name!==previousThemeName);\n    const pool=candidates.length?candidates:valid;\n    currentTheme=pool[Math.floor(rand()*pool.length)];'''
          if old not in s:
              raise SystemExit('theme selection block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>'); b=s.rfind('</script>')
          Path('/tmp/game.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/game.js
          grep -q 'const RESET_DELAY = 1500;' index.html
          ! grep -q 'toast(`Hint: ${word}`' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Keep Daily puzzles deterministic across sessions"
          git push origin HEAD:main
