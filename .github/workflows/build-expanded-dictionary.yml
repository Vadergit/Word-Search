name: Build expanded offline dictionary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-expanded-dictionary.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate dictionary and patch game
        run: python patch_expand_dictionary.py
      - name: Validate generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          words=Path('words.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          assert 'window.ANITAS_ENGLISH_WORDS = new Set' in words
          assert '<script src="words.js"></script>' in index
          assert 'ENGLISH_WORDS.has(word)' in index
          s=index.rfind('<script>'); e=index.rfind('</script>')
          Path('/tmp/index.js').write_text(index[s+8:e],encoding='utf-8')
          PY
          node --check /tmp/index.js
          node --check words.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html words.js WORDLIST_SOURCE.md
          git commit -m "Expand offline bonus word dictionary"
          git push origin HEAD:main
