name: Apply cube v0.4.2 path overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cube-v042-paths.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v0.4.2 path overlay
        run: python patch_cube_v042_paths.py
      - name: Validate
        run: |
          node --check cube/cube.js
          git diff --check
          grep -q "const APP_VERSION = '0.4.2';" cube/cube.js
          grep -q 'function renderPathLayer()' cube/cube.js
          grep -q 'foundPathByWord.set' cube/cube.js
          grep -q 'id="pathLayer"' cube/index.html
          grep -q 'v0.4.2' cube/index.html
          grep -q '.path-segment.active-path' cube/cube.css
          grep -q '.path-segment.solved-path' cube/cube.css
          ! grep -q 'v0.4.1' cube/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cube/index.html cube/cube.css cube/cube.js
          git commit -m "Cube v0.4.2: draw paths between tiles"
          git push origin HEAD:main
