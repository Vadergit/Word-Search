name: Apply Cube v1.2.0 fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cube-v120.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply v1.2.0 patch
        run: python3 patch_cube_v120.py

      - name: Validate JavaScript and required changes
        run: |
          node --check cube/cube.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          js=Path('cube/cube.js').read_text(encoding='utf-8')
          html=Path('cube/index.html').read_text(encoding='utf-8')
          css=Path('cube/cube.css').read_text(encoding='utf-8')
          assert "const APP_VERSION = '1.2.0';" in js
          assert '<1.23' in js
          assert '12*(3*GRID-2)' in js
          assert 'validateUniqueTargets(words,paths,working)' in js
          assert 'restorePuzzleCache()' in js
          assert 'cubeThemeBadge' in js
          assert 'Theme: loading' in html
          assert 'v1.2.0' in html
          assert '.theme-badge' in css
          print('v1.2.0 checks passed')
          PY

      - name: Commit v1.2.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cube/index.html cube/cube.js cube/cube.css
          git diff --cached --quiet && exit 0
          git commit -m 'Cube v1.2.0: diagonals, theme badge and robust generation'
          git push origin HEAD:main
