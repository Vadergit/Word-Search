name: Apply cube v0.4.3 top bottom hit test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cube-v043-top-bottom.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v0.4.3 fix
        run: python patch_cube_v043_top_bottom.py
      - name: Validate
        run: |
          node --check cube/cube.js
          git diff --check
          grep -q "const APP_VERSION = '0.4.3';" cube/cube.js
          grep -q 'top:\[0,-1,0\],bottom:\[0,1,0\]' cube/cube.js
          grep -q 'function validateDefaultFaceVisibility()' cube/cube.js
          grep -q 'v0.4.3' cube/index.html
          ! grep -q 'v0.4.2' cube/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cube/index.html cube/cube.js
          git commit -m "Cube v0.4.3: enable top and bottom tile input"
          git push origin HEAD:main
