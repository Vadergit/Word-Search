name: Apply Cube v1.3.0 performance update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cube-v130.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply v1.3.0 patch
        run: python3 patch_cube_v130.py

      - name: Validate
        run: |
          node --check cube/cube.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          js=Path('cube/cube.js').read_text(encoding='utf-8')
          html=Path('cube/index.html').read_text(encoding='utf-8')
          css=Path('cube/cube.css').read_text(encoding='utf-8')
          assert "const APP_VERSION = '1.3.0';" in js
          assert 'FAST_TEMPLATE_BANK' in js
          assert 'buildCubeOrientationMaps' in js
          assert 'tryFastTemplate' in js
          assert 'formatSolveTime' in js
          assert 'startSolveClock' in js
          assert 'cubeBestTimeMs' in js
          assert 'id="elapsedStat"' in html
          assert 'v1.3.0' in html
          assert 'repeat(5,minmax(0,1fr))' in css
          print('v1.3.0 validation passed')
          PY

      - name: Commit v1.3.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cube/index.html cube/cube.css cube/cube.js
          git diff --cached --quiet && exit 0
          git commit -m 'Cube v1.3.0: instant prevalidated puzzles and solve timer'
          git push origin HEAD:main
