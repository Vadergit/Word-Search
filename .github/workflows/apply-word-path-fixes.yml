name: Apply Word Path fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-word-path-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply fixes
        run: python apply_word_path_fixes.py

      - name: Syntax check
        run: |
          python -c "from pathlib import Path; t=Path('index.html').read_text(); Path('/tmp/game.js').write_text(t[t.rfind('<script>')+8:t.rfind('</script>')])"
          node --check /tmp/game.js
          git diff --check

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix selection highlight and enforce unique word paths"
          git push origin HEAD:main
