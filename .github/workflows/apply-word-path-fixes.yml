name: Apply Word Path fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-word-path-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Word Path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Could not find expected block: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              '<p class="subtitle">No time limit. Recognition happens only after the selection pause expires. Correct target spellings are accepted even if more than one valid route exists.</p>',
              '<p class="subtitle">No time limit. Recognition happens only after the selection pause expires. Every target word is generated with one unique valid path.</p>',
              'subtitle'
          )

          old_generate = '''  function generateBoard(){
            chooseTheme();

            /*
              Important:
              A target word should ideally have only ONE possible spelling path in
              the finished board. The generator therefore checks the complete board
              after creation and regenerates it when a target can be traced in more
              than one way.

              Short words are naturally more likely to occur accidentally, especially
              on 9×9 and 12×12 boards, so after a bounded number of attempts we use
              the board with the fewest duplicates. Recognition is still forgiving:
              ANY correctly spelled target path is accepted by the game.
            */
            const boardAttempts=SIZE===6?24:SIZE===9?16:10;

            let best=null;

            for(let attempt=0;attempt<boardAttempts;attempt++){
              const selectedWords=selectWordsExact(currentTheme.words,CELL_COUNT);
              const candidate=makeBoardCandidate(selectedWords);

              if(
                !best ||
                candidate.duplicateScore<best.duplicateScore
              ){
                best={
                  ...candidate,
                  selectedWords
                };
              }

              if(candidate.duplicateScore===0){
                break;
              }
            }

            if(!best)throw new Error("Could not generate puzzle.");

            board=best.grid;
            targets=shuffle(best.selectedWords);
            intendedPaths=best.paths;
          }'''

          new_generate = '''  function generateBoard(){
            chooseTheme();

            /*
              Every target word MUST have exactly one valid spelling path in the
              finished board. If even one target can be traced in a second way, the
              entire candidate is rejected. This keeps neighbouring word segments
              unambiguous, so an identical letter can never be borrowed from the
              next target word.
            */
            const boardAttempts=SIZE===6?80:SIZE===9?48:24;

            for(let attempt=0;attempt<boardAttempts;attempt++){
              const selectedWords=selectWordsExact(currentTheme.words,CELL_COUNT);
              const candidate=makeBoardCandidate(selectedWords);

              if(candidate.duplicateScore!==0)continue;

              board=candidate.grid;
              targets=shuffle(selectedWords);
              intendedPaths=candidate.paths;
              return;
            }

            throw new Error("Could not generate a puzzle with unique target paths.");
          }'''
          replace_once(old_generate, new_generate, 'generateBoard')

          old_polyline = '''  function makePolyline(points,stroke,opacity=1){
            if(!points.length)return null;
            const ns="http://www.w3.org/2000/svg";
            const p=document.createElementNS(ns,"polyline");
            p.setAttribute("points",points.map(pt=>`${pt.x},${pt.y}`).join(" "));
            p.setAttribute("fill","none");
            p.setAttribute("stroke",stroke);
            const cell=boardEl.children[0]?.getBoundingClientRect();
            const ratio=SIZE===6?.65:SIZE===9?.62:.60;
            p.setAttribute("stroke-width",Math.max(16,(cell?.width||50)*ratio));
            p.setAttribute("stroke-linecap","round");
            p.setAttribute("stroke-linejoin","round");
            p.setAttribute("opacity",opacity);
            return p;
          }'''

          new_polyline = '''  function trailWidth(){
            const cell=boardEl.children[0]?.getBoundingClientRect();
            const ratio=SIZE===6?.65:SIZE===9?.62:.60;
            return Math.max(16,(cell?.width||50)*ratio);
          }

          function makePolyline(points,stroke,opacity=1){
            if(!points.length)return null;
            const ns="http://www.w3.org/2000/svg";
            const p=document.createElementNS(ns,"polyline");
            p.setAttribute("points",points.map(pt=>`${pt.x},${pt.y}`).join(" "));
            p.setAttribute("fill","none");
            p.setAttribute("stroke",stroke);
            p.setAttribute("stroke-width",trailWidth());
            p.setAttribute("stroke-linecap","round");
            p.setAttribute("stroke-linejoin","round");
            p.setAttribute("opacity",opacity);
            return p;
          }

          function makeTrailDot(point,fill,opacity=1){
            if(!point)return null;
            const ns="http://www.w3.org/2000/svg";
            const circle=document.createElementNS(ns,"circle");
            circle.setAttribute("cx",point.x);
            circle.setAttribute("cy",point.y);
            circle.setAttribute("r",trailWidth()/2);
            circle.setAttribute("fill",fill);
            circle.setAttribute("opacity",opacity);
            return circle;
          }'''
          replace_once(old_polyline, new_polyline, 'trail drawing helpers')

          old_active = '''    /* Every active selection gets exactly the same trail, regardless of
               whether it will later be valid, invalid, target, or bonus. */
            if(selected.length){
              const poly=makePolyline(selected.map(cellCenter),"#59c9c4",.72);
              if(poly)svgEl.appendChild(poly);
            }'''

          new_active = '''    /* The first selected tile uses a round trail cap with the exact same
               width, colour and opacity as a multi-cell path. From the second tile
               onward the normal polyline takes over seamlessly. */
            if(selected.length===1){
              const dot=makeTrailDot(cellCenter(selected[0]),"#59c9c4",.72);
              if(dot)svgEl.appendChild(dot);
            }else if(selected.length>1){
              const poly=makePolyline(selected.map(cellCenter),"#59c9c4",.72);
              if(poly)svgEl.appendChild(poly);
            }'''
          replace_once(old_active, new_active, 'active selection drawing')

          old_target = '''  function findTargetFromSelection(){
            const word=selectedWord();

            /*
              A theme word is recognised by its spelling, not by one hidden
              "official" route. This prevents the frustrating case where the player
              writes the correct word but chooses another equally valid last letter.
              The generator still tries to make each target appear only once.
            */
            if(!targets.includes(word))return null;
            if(foundTargets.has(word))return null;

            return word;
          }'''

          new_target = '''  function findTargetFromSelection(){
            const word=selectedWord();

            if(!targets.includes(word))return null;
            if(foundTargets.has(word))return null;

            /* Unique-path generation should make this check redundant, but keeping
               it here is a safety net: a target can only lock on the exact path the
               generator assigned to it. */
            const intended=intendedPaths.get(word);
            if(!samePath(selected,intended))return null;

            return word;
          }'''
          replace_once(old_target, new_target, 'target recognition')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check game script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.rfind('<script>')
          end = text.rfind('</script>')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Could not extract script for syntax check')
          Path('/tmp/word-path.js').write_text(text[start + len('<script>'):end], encoding='utf-8')
          PY
          node --check /tmp/word-path.js

      - name: Commit fixes to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Fix selection highlight and enforce unique word paths"
          git push origin HEAD:main
