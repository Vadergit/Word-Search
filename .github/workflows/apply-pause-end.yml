name: Apply pause and end game

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pause-end.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply pause and end patch
        run: python patch_pause_end.py
      - name: Validate script
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          s=t.rfind('<script>'); e=t.rfind('</script>')
          if s<0 or e<=s: raise SystemExit('No script in index.html')
          Path('/tmp/index.js').write_text(t[s+8:e],encoding='utf-8')
          assert 'id="pauseBtn"' in t
          assert 'id="endGameBtn"' in t
          assert 'id="resumePausedBtn"' in t
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add pause and end game controls"
          git push origin HEAD:main
