name: Apply cube v0.6.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cube-v060.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v0.6.0 changes
        run: python patch_cube_v060.py
      - name: Validate
        run: |
          node --check cube/cube.js
          git diff --check
          grep -q "const APP_VERSION = '0.6.0';" cube/cube.js
          grep -q 'normalizeAngle(rotY+dx\*0.34)' cube/cube.js
          ! grep -q 'rotX=Math.max' cube/cube.js
          grep -q 'anitasWordCubeTheme' cube/cube.js
          grep -q 'id="themeBtn"' cube/index.html
          grep -q 'cube.css?v=0.6.0' cube/index.html
          grep -q ':root\[data-theme="light"\]' cube/cube.css
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cube/index.html cube/cube.js cube/cube.css
          git commit -m "Cube v0.6.0: endless rotation and light theme"
          git push origin HEAD:main
