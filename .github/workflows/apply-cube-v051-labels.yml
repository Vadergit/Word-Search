name: Apply cube v0.5.1 label projection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cube-v051-labels.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v0.5.1 label projection
        run: python patch_cube_v051_labels.py
      - name: Validate
        run: |
          node --check cube/cube.js
          git diff --check
          grep -q "const APP_VERSION = '0.5.1';" cube/cube.js
          grep -q "ctx.font='800 0.58px Georgia" cube/cube.js
          grep -q 'cube.js?v=0.5.1' cube/index.html
          grep -q 'cube.css?v=0.5.1' cube/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cube/cube.js cube/index.html
          git commit -m "Cube v0.5.1: project letters onto tile planes"
          git push origin HEAD:main
