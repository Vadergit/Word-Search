name: Apply Word Path enhancements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-enhancements.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply enhancements
        run: python enhance_word_path.py

      - name: Syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          start=text.rfind('<script>')
          end=text.rfind('</script>')
          if start<0 or end<=start:
              raise SystemExit('Could not extract game script')
          Path('/tmp/word-path.js').write_text(text[start+len('<script>'):end],encoding='utf-8')
          PY
          node --check /tmp/word-path.js
          grep -q 'const RESET_DELAY = 1500;' index.html
          ! grep -q 'toast(`Hint: ${word}`' index.html

      - name: Commit enhanced game
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Expand Word Path gameplay and progression"
          git push origin HEAD:main
