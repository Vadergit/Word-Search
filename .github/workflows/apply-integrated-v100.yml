name: Apply integrated v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-integrated-v100.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply integration
        run: python3 patch_integrated_v100.py

      - name: Validate JavaScript
        run: |
          node --check themes.js
          node --check cube/cube.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['index.html','stats.html']:
              text=Path(name).read_text()
              scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',text,re.S)
              inline='\n'.join(s for s in scripts if s.strip())
              out=Path('/tmp')/(name.replace('.html','.js'))
              out.write_text(inline)
              print(name, len(inline))
          PY
          node --check /tmp/index.js
          node --check /tmp/stats.js
          git diff --check

      - name: Validate integration requirements
        run: |
          grep -q "const RESET_DELAY = 1500;" index.html
          grep -q "Hint tiles highlighted" index.html
          grep -q "ANITAS_THEME_POOLS" index.html
          grep -q "themes.js?v=1.0.0" index.html
          grep -q "data-game-type=\"3d\"" index.html
          grep -q "window.location.href=\"cube/\"" index.html
          grep -q "const APP_VERSION = '1.0.0';" cube/cube.js
          grep -q "ANITAS_THEME_POOLS" cube/cube.js
          grep -q "anitasWordPathActiveProfile" cube/cube.js
          grep -q "recordCubeCompletion" cube/cube.js
          grep -q "cubePuzzles" cube/cube.js
          grep -q "let saved='light'" cube/cube.js
          grep -q "data-theme=\"light\"" cube/index.html
          grep -q "themes.js?v=1.0.0" cube/index.html
          grep -q "WC-" stats.html
          grep -q "3D Word Cube" stats.html

      - name: Validate shared theme library
        run: |
          python3 - <<'PY'
          import re, pathlib
          src=pathlib.Path('themes.js').read_text()
          names=re.findall(r'"name":"([^"]+)"',src)
          words=re.findall(r'"([A-Z]+)"',src)
          assert len(names)==19, names
          assert len(words)>800, len(words)
          for required in ['Tricking','Bouldering','Climbing','Animals','Ocean','Technology','City']:
              assert required in names, required
          print(f'{len(names)} shared themes / {len(words)} shared word entries')
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html themes.js cube/cube.js cube/index.html cube/cube.css stats.html
          git diff --cached --quiet && exit 0
          git commit -m "Integrate 3D Cube with profiles and shared themes v1.0.0"
          git push origin HEAD:main
