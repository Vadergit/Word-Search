name: Apply Cube difficulty v1.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cube-difficulty-v110.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply v1.1.0 difficulty integration
        run: python3 patch_cube_difficulty_v110.py

      - name: Validate JavaScript and HTML scripts
        run: |
          node --check cube/cube.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',text,re.S)
          inline='\n'.join(s for s in scripts if s.strip())
          Path('/tmp/index-v110.js').write_text(inline)
          PY
          node --check /tmp/index-v110.js
          git diff --check

      - name: Validate difficulty requirements
        run: |
          grep -q 'Word game suite · v1.1.0' index.html
          grep -q 'difficultySetting.classList.remove("hidden")' index.html
          grep -q 'anitasWordCubeDifficulty' index.html
          grep -q 'Start 3D cube' index.html
          grep -q "const APP_VERSION = '1.1.0';" cube/cube.js
          grep -q 'CUBE_DIFFICULTIES' cube/cube.js
          grep -q "beginner:{label:'Beginner'" cube/cube.js
          grep -q "middle:{label:'Middle'" cube/cube.js
          grep -q "hard:{label:'Hard'" cube/cube.js
          grep -q 'Hint tiles highlighted' cube/cube.js
          grep -q "cubeDifficulty==='hard'" cube/cube.js
          grep -q 'cubeDifficultyBadge' cube/index.html
          grep -q 'id="hintBtn"' cube/index.html
          grep -q 'v1.1.0' cube/index.html
          grep -q 'cube.css?v=1.1.0' cube/index.html
          grep -q 'cube.js?v=1.1.0' cube/index.html
          grep -q "let saved='light'" cube/cube.js
          grep -q "let currentTheme = 'light'" cube/cube.js

      - name: Validate shared themes can fill all difficulties
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          src=Path('themes.js').read_text()
          m=re.search(r'const themes = (\[.*\]);\n  window\.ANITAS_THEME_POOLS',src,re.S)
          assert m, 'themes array not found'
          themes=json.loads(m.group(1))
          cfg={
            'beginner':(3,8,[10,11,12,9,8]),
            'middle':(4,11,[7,8,9,10,6,11]),
            'hard':(5,14,[5,6,7,8,9]),
          }
          def possible(words,min_len,max_len,counts):
            lengths=[len(w) for w in dict.fromkeys(words) if min_len<=len(w)<=max_len]
            states={(0,0)}
            for n in lengths:
              for total,count in list(states):
                if count<12 and total+n<=54:
                  states.add((total+n,count+1))
            return any((54,c) in states for c in counts)
          failures=[]
          for theme in themes:
            for name,(lo,hi,counts) in cfg.items():
              if not possible(theme['words'],lo,hi,counts): failures.append((theme['name'],name))
          print('primary difficulty fill failures:', failures)
          assert len(failures)<=6, failures
          PY

      - name: Commit v1.1.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cube/cube.js cube/index.html cube/cube.css
          git diff --cached --quiet && exit 0
          git commit -m 'Add 3D Cube difficulty levels v1.1.0'
          git push origin HEAD:main
