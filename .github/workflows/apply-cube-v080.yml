name: Apply cube v0.8.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cube-v080.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply theme expansion
        run: python3 patch_cube_v080.py

      - name: Validate JavaScript and version
        run: |
          node --check cube/cube.js
          git diff --check
          grep -q "const APP_VERSION = '0.8.0';" cube/cube.js
          grep -q "name:'Bouldering'" cube/cube.js
          grep -q "name:'Climbing'" cube/cube.js
          grep -q "name:'Tricking'" cube/cube.js
          grep -q 'chooseCoverWords(theme.words)' cube/cube.js
          grep -q 'wordThemeNameEl.textContent' cube/cube.js
          grep -q 'cube.js?v=0.8.0' cube/index.html
          grep -q 'cube.css?v=0.8.0' cube/index.html
          grep -q 'id="wordThemeName"' cube/index.html

      - name: Validate all theme pools
        run: |
          python3 - <<'PY'
          import re, pathlib
          src=pathlib.Path('cube/cube.js').read_text()
          block=src[src.index('const WORD_THEMES = ['):src.index('const WORD_THEME_WORD_COUNT')]
          names=re.findall(r"\{name:'([^']+)',words:\[",block)
          words=re.findall(r"'([A-Z]+)'",block)
          assert len(names)==14, names
          assert len(words)>=600, len(words)
          for required in ['Cosmic','Ocean','Nature','Animals','Adventure','Fantasy','Science','Technology','Bouldering','Climbing','Tricking','Food','Travel','Music']:
              assert required in names, required
          print(f'{len(names)} themes / {len(words)} curated entries')
          PY

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cube/cube.js cube/index.html
          git commit -m "Cube v0.8.0: add 14 word themes"
          git push origin HEAD:main
