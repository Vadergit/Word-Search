name: Apply v0.7.1 fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v071.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fixes
        run: python patch_v071.py
      - name: Validate
        run: |
          node --check cube/cube.js
          git diff --check
          grep -q "const APP_VERSION = '0.7.1';" cube/cube.js
          grep -q 'drawSegmentOnFace' cube/cube.js
          grep -q 'facePathWidth' cube/cube.js
          grep -q 'selected=selected.slice(0,selectedIndex);' index.html
          grep -q 'cube.js?v=0.7.1' cube/index.html
          ! grep -q 'drawBadge(' cube/cube.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cube/index.html cube/cube.js
          git commit -m "Cube v0.7.1: clip paths and improve deselection"
          git push origin HEAD:main
